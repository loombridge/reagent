[package]
name = "reagent-engine"
description = "Reagent's synthesis engine: oscillators, filters, the mixer and routing, envelopes, LFOs and the modulation matrix, assembled from the plug-in kit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lspk-dsp.workspace = true
lspk-mod.workspace = true
lspk-params.workspace = true
# The processor interface and events, without any format.
lspk-plugin.workspace = true
lspk-voice.workspace = true
lspk-wavetable.workspace = true
# The MTS-ESP client loads ODDSound's library at run time.
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

