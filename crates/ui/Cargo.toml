[package]
name = "reagent-ui"
description = "Reagent's interface, built from the plug-in kit's widgets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The code is GPL-3.0-or-later; the bundled typefaces (assets/fonts) are
# OFL-1.1, which deny.toml allows for fonts.
license = "GPL-3.0-or-later AND OFL-1.1"
repository.workspace = true
publish.workspace = true

[dependencies]
lspk-ui.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lspk-params.workspace = true
lspk-plugin.workspace = true
lspk-test.workspace = true
tempfile = "3"

[lints]
workspace = true
